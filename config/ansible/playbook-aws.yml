---
- name: Provision AWS-Native Staging Box (Stable Docker via Ubuntu repo)
  hosts: localhost
  connection: local
  become: true

  handlers:
    - name: restart docker
      service:
        name: docker
        state: restarted

    - name: restart ssh
      service:
        name: ssh
        state: restarted

  vars:
    infra_conf: "{{ lookup('ini', 'ECR_URL type=properties file=/etc/infra_config.env') | default('', true) }}"
    project_root: "{{ lookup('ini', 'PROJECT_ROOT type=properties file=/etc/infra_config.env') | default('/opt/project', true) }}"
    project_name: "{{ lookup('ini', 'PROJECT_NAME type=properties file=/etc/infra_config.env') | default('staging', true) }}"
    aws_region: "{{ infra_conf.split('.')[3] if (infra_conf and 'dkr.ecr' in infra_conf) else 'us-east-1' }}"
    root_domain: "teamcanvas.site"
    apps_config: "{{ lookup('file', project_root + '/config/apps-config.yml') | from_yaml | default({'apps': []}, true) }}"

  tasks:
    - name: Install System Dependencies
      apt:
        pkg: [ca-certificates, curl, gnupg, unzip, python3-pip, acl]
        state: present
        update_cache: yes

    # --- AWS CLI v2 ---
    - name: Check if AWS CLI v2 is installed
      stat:
        path: /usr/local/bin/aws
      register: aws_cli_bin

    - name: Download and Install AWS CLI v2
      shell: |
        set -e
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
        unzip -o /tmp/awscliv2.zip -d /tmp
        /tmp/aws/install --update
      args:
        executable: /bin/bash
      when: not aws_cli_bin.stat.exists

    # --- DOCKER (Ubuntu repo) ---
    - name: Remove any Docker CE repo list (avoid docker.com apt path entirely)
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/sources.list.d/docker.sources
        - /etc/apt/keyrings/docker.asc
      failed_when: false

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Install Docker from Ubuntu repo (stable)
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Enable & start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes
      failed_when: false

    # --- deploy user ---
    - name: Create deploy user
      user:
        name: deploy
        groups: docker,sudo
        shell: /bin/bash
        create_home: yes
        home: /home/deploy

    - name: Add deploy user to sudoers (passwordless docker)
      lineinfile:
        path: /etc/sudoers.d/deploy
        line: "deploy ALL=(ALL) NOPASSWD: /usr/bin/docker, /usr/bin/docker-compose, /usr/local/bin/docker-compose"
        create: yes
        mode: "0440"
        validate: "visudo -cf %s"

    # --- SSH hardening ---
    - name: Disable root login via SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitRootLogin"
        line: "PermitRootLogin no"
        backup: yes
      notify: restart ssh

    - name: Disable password authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"
        backup: yes
      notify: restart ssh

    # --- UFW (AWS-native: keep 22 closed if you use SSM) ---
    - name: Install UFW
      apt:
        name: ufw
        state: present

    - name: Set UFW default policies
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: "incoming", policy: "deny" }
        - { direction: "outgoing", policy: "allow" }

    - name: Allow HTTP/HTTPS
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["80", "443"]

    - name: Enable UFW
      ufw:
        state: enabled

    # --- Docker log rotation ---
    - name: Ensure /etc/docker exists
      file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Configure Docker log rotation
      copy:
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
        dest: /etc/docker/daemon.json
        mode: "0644"
      notify: restart docker

    # --- Orchestration dirs ---
    - name: Create orchestration directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: deploy
        group: deploy
      loop:
        - "{{ project_root }}/orchestration/env"
        - "{{ project_root }}/orchestration/caddy_data"

    # --- .env ---
    - name: Generate orchestration .env
      copy:
        content: |
          # Generated by Ansible
          ECR_URL={{ infra_conf }}
          DOMAIN_NAME={{ root_domain }}
          AWS_REGION={{ aws_region }}
          OFFICE_IP=0.0.0.0/0
        dest: "{{ project_root }}/orchestration/.env"
        owner: deploy
        group: deploy
        mode: "0600"

    - name: Update Caddyfile Office IP Placeholder (if present)
      replace:
        path: "{{ project_root }}/orchestration/Caddyfile"
        regexp: "0.0.0.0/0"
        replace: "{{ lookup('ini', 'OFFICE_IP type=properties file=/etc/infra_config.env') | default('CHANGE_ME', true) }}"
      failed_when: false

    # --- SSM secrets ---
    - name: Fetch secrets from AWS SSM
      shell: |
        set -e
        aws ssm get-parameter \
          --name "/{{ project_name }}/{{ item.name }}/env" \
          --with-decryption \
          --query 'Parameter.Value' \
          --output text \
          --region {{ aws_region }}
      args:
        executable: /bin/bash
      loop: "{{ apps_config.apps }}"
      loop_control:
        label: "{{ item.name }}"
      register: ssm_secrets
      when: apps_config.apps | length > 0
      no_log: true
      failed_when: false
      changed_when: false

    - name: Write .env files for apps
      copy:
        content: "{{ item.stdout }}"
        dest: "{{ project_root }}/orchestration/env/{{ item.item.name }}.env"
        owner: deploy
        group: deploy
        mode: "0600"
      loop: "{{ ssm_secrets.results | default([]) }}"
      when:
        - item.rc is defined
        - item.rc == 0
      no_log: true

    # --- ECR login + start ---
    - name: Login to AWS ECR
      shell: |
        set -e
        aws ecr get-login-password --region {{ aws_region }} | docker login --username AWS --password-stdin {{ infra_conf }}
      args:
        executable: /bin/bash
      register: ecr_login
      retries: 3
      delay: 5
      until: ecr_login.rc == 0
      become_user: deploy
      when: infra_conf | length > 0

    - name: Set ownership of orchestration to deploy
      file:
        path: "{{ project_root }}/orchestration"
        owner: deploy
        group: deploy
        recurse: yes

    - name: Start Infrastructure (Caddy and Dozzle)
      shell: |
        set -e
        docker compose up -d caddy dozzle
      args:
        executable: /bin/bash
        chdir: "{{ project_root }}/orchestration"
      become_user: deploy
