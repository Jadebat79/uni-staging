---
- name: Provision AWS Staging Box
  hosts: localhost
  connection: local
  become: true
  handlers:
    - name: restart docker
      service:
        name: docker
        state: restarted
  vars:
    # --- CONFIGURATION (Reads from /etc/infra_config.env) ---
    project_root: "{{ lookup('ini', 'PROJECT_ROOT type=properties file=/etc/infra_config.env') }}"
    aws_region: "{{ lookup('ini', 'AWS_REGION type=properties file=/etc/infra_config.env') | default('us-east-1', true) }}"
    root_domain: "{{ lookup('ini', 'DOMAIN_NAME type=properties file=/etc/infra_config.env') | default('teamcanvas.site', true) }}"
    # Load apps configuration
    apps_config: "{{ lookup('file', project_root + '/config/apps-config.yml') | from_yaml | default({'apps': []}, true) }}"
    # Project name for SSM paths (default to 'staging', can be overridden)
    project_name: "{{ lookup('ini', 'PROJECT_NAME type=properties file=/etc/infra_config.env') | default('staging', true) }}"
    # ECR registry URL
    ecr_url: "{{ lookup('ini', 'ECR_URL type=properties file=/etc/infra_config.env') }}"

  tasks:
    # --- 1. SYSTEM PRE-REQUISITES ---
    - name: Install System Dependencies
      apt:
        pkg: [ca-certificates, curl, gnupg, unzip, python3-pip, acl]
        state: present
        update_cache: yes

    # --- 2. INSTALL AWS CLI v2 ---
    - name: Check if AWS CLI v2 is installed
      stat:
        path: /usr/local/bin/aws
      register: aws_cli_bin

    - name: Download and Install AWS CLI v2
      shell: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
        unzip -o /tmp/awscliv2.zip -d /tmp
        /tmp/aws/install --update
      when: not aws_cli_bin.stat.exists

    # --- 3. INSTALL DOCKER ---
    - name: Create Keyring Directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG Key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: true

    - name: Get System Architecture for Docker
      set_fact:
        docker_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"

    - name: Add Docker Repository
      apt_repository:
        repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        filename: docker
        state: present
        update_cache: yes

    - name: Install Docker Engine
      apt:
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Start Docker Service
      service: 
        name: docker 
        state: started 
        enabled: yes

    - name: Add ubuntu user to docker group
      user: 
        name: ubuntu 
        groups: docker 
        append: yes

    # --- 4. CREATE DEPLOY USER ---
    - name: Create deploy user
      user:
        name: deploy
        groups: docker,sudo
        shell: /bin/bash
        create_home: yes
        home: /home/deploy
        comment: "Deployment user for staging environment"

    - name: Set up deploy user SSH directory
      file:
        path: /home/deploy/.ssh
        state: directory
        owner: deploy
        group: deploy
        mode: "0700"

    - name: Add deploy user to sudoers (passwordless for deployment tasks)
      lineinfile:
        path: /etc/sudoers.d/deploy
        line: "deploy ALL=(ALL) NOPASSWD: /usr/bin/docker, /usr/bin/docker-compose, /usr/local/bin/docker-compose"
        create: yes
        mode: "0440"
        validate: "visudo -cf %s"

    # --- 5. SSH SECURITY HARDENING ---
    - name: Disable root login via SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitRootLogin"
        line: "PermitRootLogin no"
        backup: yes

    - name: Disable password authentication (SSH keys only)
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"
        backup: yes

    - name: Restart SSH service
      service:
        name: ssh
        state: restarted
        enabled: yes

    # --- 6. FIREWALL CONFIGURATION (UFW) ---
    - name: Install UFW
      apt:
        name: ufw
        state: present

    - name: Set UFW default policies
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: "incoming", policy: "deny" }
        - { direction: "outgoing", policy: "allow" }

    - name: Allow HTTP
      ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS
      ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Allow SSH
      ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Enable UFW
      ufw:
        state: enabled

    # --- 7. DOCKER LOG ROTATION CONFIGURATION ---
    - name: Create Docker daemon.json directory
      file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Configure Docker log rotation in daemon.json
      copy:
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
        dest: /etc/docker/daemon.json
        mode: "0644"
      notify: restart docker

    # --- 8. ORCHESTRATION SETUP ---
    - name: Create Directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: deploy
        group: deploy
      loop:
        - "{{ project_root }}/orchestration/env"
        - "{{ project_root }}/orchestration/caddy_data"

    # --- 9. CONFIGURATION FIXES ---
    - name: Extract AWS Account ID from ECR URL
      set_fact:
        aws_account_id: "{{ ecr_url.split('.')[0] }}"

    - name: Generate Production .env file
      copy:
        content: |
          # Generated by Ansible
          ECR_URL={{ ecr_url }}
          DOMAIN_NAME={{ root_domain }}
          AWS_REGION={{ aws_region }}
          AWS_ACCOUNT_ID={{ aws_account_id }}
          # Office IP for Caddy IP whitelist
          OFFICE_IP={{ lookup('ini', 'OFFICE_IP type=properties file=/etc/infra_config.env') | default('0.0.0.0/0', true) }}
          # Image tags (set these in /etc/infra_config.env or override in CI/CD)
          HIKEGH_BACKEND_TAG={{ lookup('ini', 'HIKEGH_BACKEND_TAG type=properties file=/etc/infra_config.env') | default('latest', true) }}
          HIKEGH_FRONTEND_TAG={{ lookup('ini', 'HIKEGH_FRONTEND_TAG type=properties file=/etc/infra_config.env') | default('latest', true) }}
          GPC_BACKEND_TAG={{ lookup('ini', 'GPC_BACKEND_TAG type=properties file=/etc/infra_config.env') | default('latest', true) }}
          GPC_FRONTEND_TAG={{ lookup('ini', 'GPC_FRONTEND_TAG type=properties file=/etc/infra_config.env') | default('latest', true) }}
        dest: "{{ project_root }}/orchestration/.env"
        owner: deploy
        group: deploy
        mode: "0600"

    - name: Update Caddyfile Office IP Placeholder
      replace:
        path: "{{ project_root }}/orchestration/Caddyfile"
        regexp: "<YOUR_OFFICE_IP>"
        replace: "{{ lookup('ini', 'OFFICE_IP type=properties file=/etc/infra_config.env') | default('CHANGE_ME', true) }}"
      failed_when: false # Don't fail if placeholder not found

    # --- 10. FETCH APPLICATION SECRETS FROM SSM ---
    - name: Check if apps are configured
      debug:
        msg: "Found {{ apps_config.apps | length }} app(s) to fetch secrets for: {{ apps_config.apps | map(attribute='name') | join(', ') }}"
      when: apps_config.apps | length > 0

    - name: Fetch secrets from AWS SSM Parameter Store
      shell: |
        aws ssm get-parameter \
          --name "/{{ project_name }}/{{ item.name }}/env" \
          --with-decryption \
          --query 'Parameter.Value' \
          --output text \
          --region {{ aws_region }}
      loop: "{{ apps_config.apps }}"
      loop_control:
        label: "{{ item.name }}"
      register: ssm_secrets
      when: apps_config.apps | length > 0
      no_log: true
      failed_when: false
      changed_when: false

    - name: Write .env file for apps
      copy:
        content: "{{ item.stdout }}"
        dest: "{{ project_root }}/orchestration/env/{{ item.item.name }}.env"
        owner: deploy
        group: deploy
        mode: "0600"
      loop: "{{ ssm_secrets.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - item.rc is defined
        - item.rc == 0
      no_log: true

    - name: Warn if secret not found
      debug:
        msg: "WARNING: Secret /{{ project_name }}/{{ item.item.name }}/env not found in SSM. Skipping .env file creation. Upload it manually or the app will fail to start."
      loop: "{{ ssm_secrets.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - item.rc is defined
        - item.rc != 0

    # --- 11. AUTHENTICATION & STARTUP ---
    - name: Login to AWS ECR
      shell: |
        aws ecr get-login-password --region {{ aws_region }} | docker login --username AWS --password-stdin {{ ecr_url }}
      register: ecr_login
      retries: 3
      delay: 5
      until: ecr_login.rc == 0
      become_user: deploy
      no_log: true

    - name: Set ownership of orchestration directory to deploy user
      file:
        path: "{{ project_root }}/orchestration"
        owner: deploy
        group: deploy
        recurse: yes

    - name: Select Fluent Bit config for AWS
      copy:
        src: "{{ project_root }}/orchestration/fluent-bit.conf"
        dest: "{{ project_root }}/orchestration/fluent-bit.conf"

    - name: Start Infrastructure (Caddy, Fluent Bit, and Dozzle - DB is external RDS)
      shell: |
        docker compose -f docker-compose-aws.yml up -d caddy fluent-bit dozzle
      args:
        chdir: "{{ project_root }}/orchestration"
      become_user: deploy

